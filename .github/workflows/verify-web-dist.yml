# Fork: rebuilds the web UI from web/src and fails if it differs from the committed web/dist,
# so the bundle that runs on the server is the code that was reviewed.
name: Verify web/dist

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: web/dist matches the sources
        run: test -z "$(git status --porcelain web/dist)" || { git status --porcelain web/dist; exit 1; }
